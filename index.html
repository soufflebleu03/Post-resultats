<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Souffle Bleu — Générateur de post</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060D1F; --panel:#0D1A38; --line:rgba(255,255,255,.15);
    --text:#FFFFFF; --muted:rgba(255,255,255,.62); --accent:#4FA8FF;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:'Barlow',sans-serif;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .wrap{max-width:640px;margin:0 auto;padding:22px 18px 48px;display:flex;flex-direction:column;gap:18px}
  h1{font-family:'Anton',sans-serif;font-size:20px;letter-spacing:2px;margin:0 0 2px}
  .sub{color:var(--muted);font-size:14px;margin:0}
  .canvas-wrap{width:100%;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#000}
  canvas{display:block;width:100%;height:auto}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px}
  label{display:block;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  input[type=text],input[type=number],select{
    width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);
    background:#0A1730;color:var(--text);font-size:16px;font-family:inherit;
  }
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .toggle{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .toggle button{flex:1;padding:12px;background:#0A1730;color:var(--muted);border:none;font-family:inherit;font-size:15px;font-weight:600}
  .toggle button.active{background:var(--accent);color:#06152F}
  .filerow{display:flex;gap:10px}
  .filerow label.btn{
    display:flex;align-items:center;justify-content:center;
    padding:12px 14px;border-radius:10px;border:1px dashed var(--line);
    color:var(--muted);font-size:14px;cursor:pointer;flex:1;text-align:center;
  }
  .filerow input{display:none}
  .clearbtn{background:none;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:0 16px;font-family:inherit;font-size:14px}
  .download{
    width:100%;padding:16px;border-radius:12px;border:none;
    background:var(--accent);color:#06152F;font-family:'Anton',sans-serif;
    font-size:18px;letter-spacing:2px;cursor:pointer;
  }
  .status{font-size:13px;color:var(--muted);text-align:center;min-height:18px}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>SOUFFLE BLEU — GÉNÉRATEUR DE POST</h1>
    <p class="sub">Remplis les infos du match, le visuel se met à jour en direct, puis télécharge-le.</p>
  </div>

  <div class="canvas-wrap"><canvas id="cv" width="1080" height="1080"></canvas></div>

  <div class="panel">
    <div>
      <label for="moment">Moment</label>
      <select id="moment">
        <option value="avant">Avant-match</option>
        <option value="q1">Fin du 1er quart-temps</option>
        <option value="q2">Fin du 2e quart-temps</option>
        <option value="mt">Mi-temps</option>
        <option value="q3">Fin du 3e quart-temps</option>
        <option value="q4">Fin du 4e quart-temps</option>
        <option value="final" selected>Score final</option>
      </select>
    </div>

    <div>
      <label>Domicile ou extérieur</label>
      <div class="toggle">
        <button type="button" id="dom" class="active">Domicile</button>
        <button type="button" id="ext">Extérieur</button>
      </div>
    </div>

    <div>
      <label for="adv">Adversaire</label>
      <input type="text" id="adv" value="Rouen">
    </div>

    <div class="row2">
      <div>
        <label for="scoreJav">Score JA Vichy</label>
        <input type="number" id="scoreJav" value="84">
      </div>
      <div>
        <label for="scoreAdv">Score adversaire</label>
        <input type="number" id="scoreAdv" value="76">
      </div>
    </div>

    <div>
      <label for="comp">Compétition</label>
      <input type="text" id="comp" placeholder="Ex : Championnat Régional">
    </div>

    <div class="row2">
      <div>
        <label for="date">Date / heure</label>
        <input type="text" id="date" placeholder="Ex : 25 sept. 20h">
      </div>
      <div>
        <label for="lieu">Lieu</label>
        <input type="text" id="lieu" placeholder="Ex : Gymnase Coubertin">
      </div>
    </div>

    <div>
      <label>Photo du joueur</label>
      <div class="filerow">
        <label class="btn" for="photo">Choisir une photo (fond détouré conseillé)</label>
        <input type="file" id="photo" accept="image/*">
        <button type="button" class="clearbtn" id="clearPhoto">Retirer</button>
      </div>
    </div>

    <button class="download" id="dl">Télécharger le visuel</button>
    <div class="status" id="status"></div>
  </div>
</div>

<script>
(async function(){
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const W = 1080, H = 1080;

  const els = {
    moment: document.getElementById('moment'),
    adv: document.getElementById('adv'),
    scoreJav: document.getElementById('scoreJav'),
    scoreAdv: document.getElementById('scoreAdv'),
    comp: document.getElementById('comp'),
    date: document.getElementById('date'),
    lieu: document.getElementById('lieu'),
    dom: document.getElementById('dom'),
    ext: document.getElementById('ext'),
    photo: document.getElementById('photo'),
    clearPhoto: document.getElementById('clearPhoto'),
    dl: document.getElementById('dl'),
    status: document.getElementById('status'),
  };

  let homeAway = 'dom';
  let photoImg = null;

  els.dom.addEventListener('click', ()=>{ homeAway='dom'; els.dom.classList.add('active'); els.ext.classList.remove('active'); draw(); });
  els.ext.addEventListener('click', ()=>{ homeAway='ext'; els.ext.classList.add('active'); els.dom.classList.remove('active'); draw(); });

  ['moment','adv','scoreJav','scoreAdv','comp','date','lieu'].forEach(function(k){
    els[k].addEventListener('input', draw);
    els[k].addEventListener('change', draw);
  });

  els.photo.addEventListener('change', function(e){
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const img = new Image();
    img.onload = function(){ photoImg = img; draw(); };
    img.src = URL.createObjectURL(file);
  });
  els.clearPhoto.addEventListener('click', function(){ photoImg = null; els.photo.value=''; draw(); });

  function momentLabel(v){
    switch(v){
      case 'avant': return 'AVANT-MATCH';
      case 'q1': return 'FIN DU 1ER QT';
      case 'q2': return 'FIN DU 2E QT';
      case 'mt': return 'MI-TEMPS';
      case 'q3': return 'FIN DU 3E QT';
      case 'q4': return 'FIN DU 4E QT';
      default: return '';
    }
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function drawBlurCircle(cx,cy,r,color,blur){
    ctx.save();
    ctx.filter = 'blur('+blur+'px)';
    const g = ctx.createRadialGradient(cx,cy,0,cx,cy,r);
    g.addColorStop(0, color);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalCompositeOperation = 'screen';
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function drawFlame(x,y,s,color){
    ctx.save();
    ctx.translate(x,y); ctx.scale(s,s);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0,-14);
    ctx.bezierCurveTo(-8,-4,-8,4,0,10);
    ctx.bezierCurveTo(8,4,8,-4,0,-14);
    ctx.fill();
    ctx.restore();
  }

  function drawDiamondScore(cx,cy,score,glow){
    const w=150, h=76;
    ctx.save();
    ctx.translate(cx,cy);
    ctx.transform(1,0,-0.28,1,0,0);
    ctx.fillStyle = '#12294F';
    ctx.strokeStyle = glow;
    ctx.lineWidth = 3;
    roundRect(-w/2,-h/2,w,h,10);
    ctx.fill(); ctx.stroke();
    ctx.restore();
    ctx.save();
    ctx.font = "46px 'Anton'";
    ctx.fillStyle = '#FFFFFF';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(String(score), cx+18, cy+2);
    ctx.restore();
  }

  function fitCover(img,dx,dy,dw,dh){
    const ir = img.width/img.height, dr = dw/dh;
    let sx,sy,sw,sh;
    if(ir > dr){ sh = img.height; sw = sh*dr; sy=0; sx=(img.width-sw)/2; }
    else { sw = img.width; sh = sw/dr; sx=0; sy=(img.height-sh)/2; }
    ctx.drawImage(img, sx,sy,sw,sh, dx,dy,dw,dh);
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = '#060D1F';
    ctx.fillRect(0,0,W,H);

    const glow = ctx.createRadialGradient(W/2,H*0.18,0,W/2,H*0.18,W*0.6);
    glow.addColorStop(0,'rgba(64,146,255,0.42)');
    glow.addColorStop(1,'rgba(64,146,255,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0,0,W,H);

    drawBlurCircle(-60,-60,430,'rgba(140,200,255,0.55)',40);
    drawBlurCircle(W+60,-80,460,'rgba(140,200,255,0.5)',44);
    drawBlurCircle(-40,H+40,340,'rgba(90,170,255,0.4)',36);
    drawBlurCircle(W+40,H+60,360,'rgba(90,170,255,0.35)',36);

    const photoH = 700;
    if(photoImg){
      fitCover(photoImg,0,0,W,photoH);
    } else {
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,0.28)';
      ctx.lineWidth = 3;
      ctx.setLineDash([10,10]);
      ctx.strokeRect(4,4,W-8,photoH-8);
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.font = "24px 'Anton'";
      ctx.fillText('PHOTO DU JOUEUR', W/2, photoH/2 - 6);
      ctx.font = "17px 'Barlow'";
      ctx.fillText('choisissez une photo ci-dessous', W/2, photoH/2 + 26);
      ctx.restore();
    }

    const fade = ctx.createLinearGradient(0,420,0,700);
    fade.addColorStop(0,'rgba(6,13,31,0)');
    fade.addColorStop(0.92,'#060D1F');
    ctx.fillStyle = fade;
    ctx.fillRect(0,420,W,280);

    drawFlame(70,58,1.6,'#4FA8FF');
    ctx.fillStyle = '#FFFFFF';
    ctx.font = "20px 'Anton'";
    ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText('LE SOUFFLE BLEU', 96, 58);

    ctx.strokeStyle = '#4FA8FF';
    ctx.lineWidth = 2;
    roundRect(W-206,40,150,38,6);
    ctx.stroke();
    ctx.fillStyle = '#FFFFFF';
    ctx.font = "18px 'Anton'";
    ctx.textAlign='center';
    ctx.fillText('JA VICHY', W-131, 59);

    const moment = els.moment.value;
    const adv = (els.adv.value || '[ADVERSAIRE]').toUpperCase();
    const sj = parseInt(els.scoreJav.value,10) || 0;
    const sa = parseInt(els.scoreAdv.value,10) || 0;
    const homeTeam = homeAway==='dom' ? 'JA VICHY' : adv;
    const awayTeam = homeAway==='dom' ? adv : 'JA VICHY';

    ctx.textAlign='center'; ctx.textBaseline='alphabetic';

    if(moment==='avant'){
      ctx.save();
      ctx.transform(1,0,-0.11,1,0,0);
      ctx.shadowColor = '#6FE3FF'; ctx.shadowBlur = 30;
      ctx.fillStyle = '#EAFEFF';
      ctx.font = "88px 'Anton'";
      ctx.fillText(homeTeam, W/2+80, 750);
      ctx.font = "56px 'Anton'";
      ctx.fillStyle = '#4FA8FF';
      ctx.fillText('VS', W/2+80, 818);
      ctx.fillStyle = '#EAFEFF';
      ctx.font = "88px 'Anton'";
      ctx.fillText(awayTeam, W/2+80, 890);
      ctx.restore();
    } else if(moment==='final'){
      const tie = sj===sa, win = sj>sa;
      const label = tie ? 'ÉGALITÉ' : (win ? 'VICTOIRE' : 'DÉFAITE');
      ctx.save();
      ctx.transform(1,0,-0.105,1,0,0);
      ctx.font = (label.length>7 ? "148px 'Anton'" : "172px 'Anton'");
      if(tie || win){
        ctx.fillStyle = '#EAFEFF';
        ctx.shadowColor = '#6FE3FF'; ctx.shadowBlur = 34;
      } else {
        ctx.fillStyle = '#12245E';
        ctx.strokeStyle = '#3A62E0'; ctx.lineWidth = 2;
        ctx.shadowColor = '#1B3FA6'; ctx.shadowBlur = 34;
      }
      ctx.fillText(label, W/2+84, 800);
      if(!(tie||win)) ctx.strokeText(label, W/2+84, 800);
      ctx.restore();
    } else {
      ctx.save();
      ctx.transform(1,0,-0.105,1,0,0);
      ctx.font = "108px 'Anton'";
      ctx.fillStyle = '#EAFEFF';
      ctx.shadowColor = '#6FE3FF'; ctx.shadowBlur = 30;
      ctx.fillText(momentLabel(moment), W/2+84, 790);
      ctx.restore();
    }

    if(moment!=='avant'){
      ctx.shadowBlur = 0;
      ctx.font = "30px 'Anton'";
      ctx.fillStyle = '#FFFFFF';
      ctx.fillText(homeAway==='dom' ? 'JAV' : adv.slice(0,4), W/2-260, 862);
      ctx.font = "13px 'Barlow'";
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.fillText(homeTeam, W/2-260, 886);

      drawDiamondScore(W/2-140, 862, homeAway==='dom'?sj:sa, '#4FA8FF');
      ctx.strokeStyle='rgba(255,255,255,0.25)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(W/2,834); ctx.lineTo(W/2,890); ctx.stroke();
      drawDiamondScore(W/2+140, 862, homeAway==='dom'?sa:sj, 'rgba(255,255,255,0.35)');

      ctx.font = "30px 'Anton'";
      ctx.fillStyle = '#FFFFFF';
      ctx.fillText(homeAway==='dom' ? adv.slice(0,4) : 'JAV', W/2+260, 862);
      ctx.font = "13px 'Barlow'";
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.fillText(awayTeam, W/2+260, 886);
    } else if(els.lieu.value){
      ctx.font = "18px 'Barlow'";
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.fillText(els.lieu.value, W/2, 940);
    }

    const bits = [els.comp.value, els.date.value, moment!=='avant' ? els.lieu.value : ''].filter(Boolean);
    ctx.font = "16px 'Barlow'";
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.fillText(bits.join('  •  '), W/2, 1000);

    drawFlame(W/2,1044,1.1,'#4FA8FF');
    ctx.font = "13px 'Anton'";
    ctx.fillStyle='rgba(255,255,255,0.55)';
    ctx.fillText('LE SOUFFLE BLEU', W/2, 1070);
  }

  let downloadsCap = null;
  if(typeof claude !== 'undefined' && claude.use){
    try { downloadsCap = await claude.use('downloads'); } catch(e){}
  }

  els.dl.addEventListener('click', function(){
    els.status.textContent = 'Préparation…';
    cv.toBlob(async function(blob){
      if(!blob){ els.status.textContent = 'Erreur de génération.'; return; }
      const filename = 'souffle-bleu-' + els.moment.value + '.png';
      if(downloadsCap){
        try{
          const res = await downloadsCap.save({filename: filename, data: blob});
          els.status.textContent = res.status==='saved' ? 'Visuel enregistré.' : 'Visuel transmis.';
        } catch(err){
          els.status.textContent = (err && err.code==='declined') ? '' : 'Le téléchargement a échoué.';
        }
        return;
      }
      // Hors environnement Claude (ex: hébergé sur GitHub Pages) : téléchargement navigateur classique.
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      els.status.textContent = 'Visuel téléchargé.';
    }, 'image/png');
  });

  if(document.fonts && document.fonts.ready){
    document.fonts.load("20px 'Anton'");
    document.fonts.load("20px 'Barlow'");
    document.fonts.ready.then(draw);
  }
  draw();
})();
</script>
</body>
</html>
